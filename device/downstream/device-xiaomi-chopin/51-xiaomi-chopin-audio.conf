monitor.alsa.rules = [
  {
    matches = [ { api.alsa.card.name = "mt6885-mt6359" } ]
    actions = {
      update-props = {
        # Generic Pro Audio probing opens the vendor's voice-wake PCMs and
        # leaves the codec in VOW mode. Only expose the native UCM routes.
        api.acp.disable-pro-audio = true
      }
    }
  }
  {
    matches = [ { device.name = "alsa_card.comprC0" } ]
    # Vendor compress-offload also falls back to probing the DSP/VOW PCMs.
    actions = { update-props = { device.disabled = true } }
  }
]

# This V4L2 endpoint is the vendor video decoder, not a camera. Its failed
# camera activation stalls WirePlumber's event queue, including audio linking.
monitor.v4l2.rules = [
  {
    matches = [ { device.bus-path = "platform-1602f000.vdec" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
