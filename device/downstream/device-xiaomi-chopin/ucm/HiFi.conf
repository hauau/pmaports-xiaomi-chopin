# Native routes from stock V14.0.6.0.TKPMIXM vendor/etc/audio_device.xml.
# The amplifiers must use their stock protection DSP and this phone's calibration.
SectionVerb {
	# DPCM backend links must exist before ACP probes either PCM's hw_params.
	EnableSequence [
		cset "name='I2S3_CH1 DL1_CH1' on"
		cset "name='I2S3_CH2 DL1_CH2' on"
		cset "name='UL1_CH1 ADDA_UL_CH1' on"
		cset "name='UL1_CH2 ADDA_UL_CH2' on"
	]
	DisableSequence [
		cset "name='I2S3_CH1 DL1_CH1' off"
		cset "name='I2S3_CH2 DL1_CH2' off"
		cset "name='UL1_CH1 ADDA_UL_CH1' off"
		cset "name='UL1_CH2 ADDA_UL_CH2' off"
	]
	Value {
		TQ "HiFi"
	}
}

If.SpeakerCalibration {
	Condition {
		Type Path
		Mode read
		Path "/run/xiaomi-chopin-audio-calibrated"
	}
	True {
		SectionDevice."Speaker" {
			Comment "Built-in stereo speakers"
			EnableSequence [
				cset "name='DSP1 Firmware' Protection"
				cset "name='RCV DSP1 Firmware' Protection"
				cset "name='PCM Soft Ramp' 4ms"
				cset "name='RCV PCM Soft Ramp' 4ms"
				cset "name='AMP PCM Gain' 17"
				cset "name='RCV AMP PCM Gain' 16"
				cset "name='PCM Source' DSP"
				# UCM cset uses raw integers; 817 is 0 dB, without +12 dB boost.
				cset "name='Digital PCM Volume' 817"
				cset "name='RCV Digital PCM Volume' 817"
				cset "name='RCV PCM Source' DSP"
				cset "name='ASP TX1 Source' Zero"
				cset "name='ASP TX2 Source' DSPTX1"
				cset "name='DSP RX1 Source' ASPRX2"
				cset "name='DSP RX2 Source' ASPRX2"
				cset "name='ASPTX Ref' Ref"
				cset "name='RCV ASP TX1 Source' DSPTX1"
				cset "name='RCV ASP TX2 Source' Zero"
				cset "name='RCV DSP RX1 Source' ASPRX1"
				cset "name='RCV DSP RX2 Source' ASPRX1"
				cset "name='RCV ASPTX Ref' Ref"
				cset "name='Fast Use Case Delta File' cs35l41-delta-spk-music.txt"
				cset "name='RCV Fast Use Case Delta File' cs35l41-delta-rcv-music.txt"
				cset "name='DSP1 Preload Switch' on"
				cset "name='RCV DSP1 Preload Switch' on"
				cset "name='Fast Use Case Switch Enable' on"
				cset "name='RCV Fast Use Case Switch Enable' on"
			]
			DisableSequence [
				cset "name='Digital PCM Volume' 0"
				cset "name='RCV Digital PCM Volume' 0"
				cset "name='Fast Use Case Switch Enable' off"
				cset "name='RCV Fast Use Case Switch Enable' off"
				cset "name='PCM Source' None"
				cset "name='RCV PCM Source' None"
				cset "name='DSP1 Preload Switch' off"
				cset "name='RCV DSP1 Preload Switch' off"
			]
			Value {
				PlaybackPCM "hw:${CardId},0"
				PlaybackChannels 2
				PlaybackPriority 300
			}
		}
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphones"
	EnableSequence [
		cset "name='Mic_Type_Mux_0' DCC"
		cset "name='Mic_Type_Mux_2',device=2 DCC"
		cset "name='PGA1 Volume' 3"
		cset "name='PGA2 Volume' 3"
		cset "name='UL_SRC_MUX' AMIC"
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH2"
		cset "name='ADC_L_Mux' Left Preamplifier"
		cset "name='PGA_L_Mux' AIN0"
		cset "name='ADC_R_Mux' Right Preamplifier"
		cset "name='PGA_R_Mux' AIN2"
		cset "name='DMIC0_MUX' DMIC_DATA0"
		cset "name='DMIC1_MUX' DMIC_DATA1_L_1"
	]
	DisableSequence [
		cset "name='ADC_L_Mux' Idle"
		cset "name='PGA_L_Mux' None"
		cset "name='ADC_R_Mux' Idle"
		cset "name='PGA_R_Mux' None"
	]
	Value {
		CapturePCM "hw:${CardId},10"
		CaptureChannels 2
		CapturePriority 100
	}
}
