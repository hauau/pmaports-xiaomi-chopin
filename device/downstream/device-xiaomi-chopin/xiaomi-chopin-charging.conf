# Battery percentage hysteresis: start at or below 55%, stop at or above 75%.
charge_start=55
charge_stop=75

# Charge-current ceilings in microamps; vendor limits can only reduce these.
charge_current=500000
warm_current=250000

# Battery temperature in tenths of a degree Celsius.
# Warm throttling and a hot pause both clear only after cooling to 30 C.
warm_temp=320
stop_temp=350
resume_temp=300
